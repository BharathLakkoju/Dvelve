[pytest]
asyncio_mode = auto
# FIX: must match asyncio_default_test_loop_scope (function, the pytest-asyncio
# default) — a session-scoped fixture loop paired with function-scoped test
# loops let the asyncpg pool/connections get driven by two different event
# loops, corrupting the connection protocol (InterfaceError: "another
# operation is in progress") the moment a test made a second DB-backed call.
asyncio_default_fixture_loop_scope = function
testpaths = tests
